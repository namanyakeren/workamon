[package]
name = "workamon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Pemantau server rumah dan container Docker untuk Raspberry Pi"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bollard = "0.21.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
libc = "0.2.191"
minijinja = { version = "3.1.0", features = ["serde"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
rusqlite = { version = "0.42.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
