<!doctype html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ t.login_title }}</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('workamon-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.dataset.theme = saved;
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-intro">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3.5" y="4" width="17" height="5" rx="1"/>
            <rect x="3.5" y="15" width="17" height="5" rx="1"/>
            <path d="M7 6.5h.01M7 17.5h.01M10.5 6.5h6M10.5 17.5h6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text"><strong>WORKA</strong><span>MON</span></span>
      </div>
      <h1>{{ t.login_hero|safe }}</h1>
      <p>{{ t.login_hero_sub }}</p>
      <ul class="login-points">
        <li><span>01</span> {{ t.login_point_1 }}</li>
        <li><span>02</span> {{ t.login_point_2 }}</li>
        <li><span>03</span> {{ t.login_point_3 }}</li>
      </ul>
      <div class="login-foot">WORKA MON v{{ version }}</div>
    </section>

    <section class="login-panel">
      <div class="login-tools">
        <div class="lang-switch" role="group" aria-label="{{ t.language }}">
          <a class="lang-btn{% if lang == 'id' %} is-active{% endif %}" href="/language/id" data-lang-switch="id" title="Bahasa Indonesia">ID</a>
          <a class="lang-btn{% if lang == 'en' %} is-active{% endif %}" href="/language/en" data-lang-switch="en" title="English">EN</a>
        </div>
        <button type="button" class="icon-btn theme-toggle login-theme" id="theme-toggle" aria-label="{{ t.theme_toggle_aria }}" title="{{ t.theme_toggle_title }}">
          <svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z"/></svg>
        </button>
      </div>

      <form class="login-form" method="post" action="/login">
        <div class="login-head">
          <h2>{{ t.login_heading }}</h2>
          <p>{{ t.login_sub }}</p>
        </div>
        {% if error %}
        <div class="flash flash-error" role="alert">{{ error }}</div>
        {% endif %}
        <label class="field">
          <span>{{ t.username }}</span>
          <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span>{{ t.password }}</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block">{{ t.login_button }}</button>
      </form>
      <p class="login-note">{{ t.login_note }}</p>
    </section>
  </main>
  <script src="/static/app.js?v={{ version }}" defer></script>
</body>
</html>
