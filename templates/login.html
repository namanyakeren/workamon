<!doctype html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ t.login_title }}</title>
  <script>(function(){try{var s=localStorage.getItem('workamon-theme');if(s==='dark'||s==='light')document.documentElement.dataset.theme=s;}catch(e){}})();</script>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-panel">
      <div class="login-tools">
        <div class="lang-switch" role="group" aria-label="{{ t.language }}">
          <a class="lang-btn{% if lang == 'id' %} is-active{% endif %}" href="/language/id">ID</a>
          <a class="lang-btn{% if lang == 'en' %} is-active{% endif %}" href="/language/en">EN</a>
        </div>
        <button type="button" class="icon-btn theme-toggle login-theme" id="theme-toggle" aria-label="{{ t.theme_toggle_aria }}" title="{{ t.theme_toggle_title }}">
          <svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z"/></svg>
        </button>
      </div>
      <form class="login-form" method="post" action="/login">
        <div class="login-head"><h2>{{ t.login_heading }}</h2><p>{{ t.login_sub }}</p></div>
        {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
        <label class="field"><span>{{ t.username }}</span><input type="text" name="username" autocomplete="username" required autofocus></label>
        <label class="field"><span>{{ t.password }}</span><input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit" class="btn btn-primary btn-block">{{ t.login_button }}</button>
        <div class="login-version">WORKAMON v{{ version }}</div>
      </form>
    </section>
  </main>
  <script src="/static/app.js?v={{ version }}" defer></script>
</body>
</html>
