<!doctype html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }} · WORKA MON</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('workamon-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.dataset.theme = saved;
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="error-body">
  <main class="error-card">
    <div class="error-code">{{ status }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="/">{{ t.error_back_dashboard }}</a>
      <a class="btn" href="/containers">{{ t.error_container }}</a>
    </div>
    <div class="lang-switch error-lang" role="group" aria-label="{{ t.language }}">
      <a class="lang-btn{% if lang == 'id' %} is-active{% endif %}" href="/language/id" data-lang-switch="id" title="Bahasa Indonesia">ID</a>
      <a class="lang-btn{% if lang == 'en' %} is-active{% endif %}" href="/language/en" data-lang-switch="en" title="English">EN</a>
    </div>
  </main>
</body>
</html>
